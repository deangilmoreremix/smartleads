# Supabase CLI configuration
# Run `supabase login` then `supabase link --project-ref <YOUR_PROJECT_REF>` to bind this repo to your project.
# The project_id below is a placeholder; `supabase link` will populate it.

project_id = "your-project-ref"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Email/password auth (used by the app's signup/login flows)
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "https://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Edge functions runtime (the 20 functions under supabase/functions/)
[edge_runtime]
enabled = true
policy = "oneshot"
verify_jwt = true
